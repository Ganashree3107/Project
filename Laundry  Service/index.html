<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laundry Services</title>
    <link rel="stylesheet" href="laundry.css">
</head>
<body>

    <!-- ================= NAVBAR ================= -->
    <nav class="navbar">
        <!-- Logo (image + text) -->
        <div class="logo">
            <img src="logo.png" alt="Laundry Logo">
            <span>Laundry</span>
        </div>

        <!-- Center menu -->
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">About Us</a></li>
            <li><a href="#">Contact Us</a></li>
        </ul>

        <!-- Login button -->
        <div class="login-btn">
            <button>Login</button>
        </div>
    </nav>

    <!-- ================= HERO SECTION ================= -->
    <section class="hero">
        <div class="hero-left">
            <h1>
                Revitalize Your <br>Clothes with Expert<br>
                <span>Laundry Services</span>
            </h1>
            <p>
                From premium dry cleaning to fast wash and fold,
                we provide professional care for your clothes.
                Schedule a pickup today and enjoy freshness.
            </p>
            <button class="hero-btn">Book a Service Today</button>
        </div>

        <div class="hero-right">
            <img src="laundry.png" alt="Laundry Machine">
        </div>
    </section>

</body>
</html>
